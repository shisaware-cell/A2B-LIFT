<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password | A2B LIFT</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0b0f;
        color: #f7f7f8;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0b0b0f;
      }
      main { width: min(100%, 420px); }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        font-size: 20px;
        font-weight: 700;
      }
      .brand img {
        width: 44px;
        height: 44px;
        display: block;
        border-radius: 10px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }
      .intro {
        margin: 0 0 28px;
        color: #aaaab2;
        font-size: 15px;
        line-height: 1.5;
      }
      form { display: grid; gap: 18px; }
      label {
        display: grid;
        gap: 8px;
        color: #d7d7dc;
        font-size: 13px;
        font-weight: 600;
      }
      input {
        width: 100%;
        border: 1px solid #34343b;
        border-radius: 8px;
        outline: none;
        background: #17171c;
        color: #ffffff;
        padding: 14px;
        font: inherit;
      }
      input:focus { border-color: #ffffff; }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: #ffffff;
        color: #0b0b0f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled { cursor: wait; opacity: .65; }
      #message {
        display: none;
        margin: 0 0 18px;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 14px;
        line-height: 1.45;
      }
      #message.error {
        display: block;
        border: 1px solid #6d3030;
        background: #2a1719;
        color: #ffb8bc;
      }
      #message.success {
        display: block;
        border: 1px solid #285c3f;
        background: #14271d;
        color: #a9e8c2;
      }
      .fine-print {
        margin-top: 20px;
        color: #777780;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/assets/images/icon.png" alt="" />
        <span>A2B LIFT</span>
      </div>
      <h1>Choose a new password</h1>
      <p class="intro">Enter a new password for your A2B LIFT account.</p>
      <p id="message" role="status" aria-live="polite"></p>
      <form id="reset-form">
        <label>
          New password
          <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required />
        </label>
        <label>
          Confirm password
          <input id="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required />
        </label>
        <button id="submit" type="submit">Update password</button>
      </form>
      <p class="fine-print">Reset links expire after 30 minutes and can only be used once.</p>
    </main>
    <script>
      const form = document.getElementById("reset-form");
      const submit = document.getElementById("submit");
      const message = document.getElementById("message");
      const token = new URLSearchParams(window.location.search).get("token") || "";

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
      }

      if (!token) {
        showMessage("This password reset link is incomplete. Request a new link from the app.", "error");
        form.hidden = true;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.getElementById("password").value;
        const confirmation = document.getElementById("confirmation").value;
        if (password !== confirmation) {
          showMessage("The passwords do not match.", "error");
          return;
        }

        submit.disabled = true;
        submit.textContent = "Updating...";
        try {
          const response = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.message || "Unable to reset password.");
          showMessage("Your password has been updated. You can return to the app and sign in.", "success");
          form.hidden = true;
        } catch (error) {
          showMessage(error.message || "Unable to reset password. Request a new link and try again.", "error");
        } finally {
          submit.disabled = false;
          submit.textContent = "Update password";
        }
      });
    </script>
  </body>
</html>
